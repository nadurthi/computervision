<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" style="width:100%;height:auto;display:block" role="img" aria-label="SeamNet U-Net: 8-channel RGB-D input at 320 by 240, four encoder blocks of 24, 48, 96 and 192 channels, three decoder blocks with skip connections, a 3-class head, then watershed decoding into instances." font-family="Inter, system-ui, sans-serif">
<rect width="1200" height="470" fill="#ffffff"/>
<defs><marker id="sa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
<text x="30" y="34" font-size="18" font-weight="700" fill="#1f2937">SeamNet: a 1.1 M-parameter U-Net that predicts background / interior / seam</text>
<rect x="30" y="70" width="120" height="250" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
<text x="90" y="96" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Input 8×240×320</text>
<text x="45" y="124" font-size="12" fill="#374151">RGB (3)</text><text x="45" y="146" font-size="12" fill="#374151">1/depth (1)</text><text x="45" y="168" font-size="12" fill="#374151">normals (3)</text><text x="45" y="190" font-size="12" fill="#374151">valid depth (1)</text>
<text x="45" y="230" font-size="11" fill="#6b7280">RGB variant:</text><text x="45" y="246" font-size="11" fill="#6b7280">channels 0–2 only</text>
<g font-size="12" fill="#1f2937">
<rect x="190" y="70" width="40" height="250" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.6"/><text x="210" y="340" text-anchor="middle">e1</text><text x="210" y="356" text-anchor="middle" font-size="11" fill="#6b7280">24</text><text x="210" y="372" text-anchor="middle" font-size="11" fill="#6b7280">240×320</text>
<rect x="270" y="125" width="44" height="140" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.6"/><text x="292" y="285" text-anchor="middle">e2</text><text x="292" y="301" text-anchor="middle" font-size="11" fill="#6b7280">48</text><text x="292" y="317" text-anchor="middle" font-size="11" fill="#6b7280">120×160</text>
<rect x="354" y="160" width="52" height="70" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.6"/><text x="380" y="250" text-anchor="middle">e3</text><text x="380" y="266" text-anchor="middle" font-size="11" fill="#6b7280">96 · 60×80</text>
<rect x="446" y="178" width="64" height="34" rx="4" fill="#fde2d0" stroke="#eb6834" stroke-width="1.6"/><text x="478" y="232" text-anchor="middle">e4</text><text x="478" y="248" text-anchor="middle" font-size="11" fill="#6b7280">192 · 30×40</text><text x="478" y="264" text-anchor="middle" font-size="11" fill="#6b7280">498 k params</text>
<rect x="550" y="160" width="52" height="70" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.6"/><text x="576" y="250" text-anchor="middle">d3</text><text x="576" y="266" text-anchor="middle" font-size="11" fill="#6b7280">96 · 60×80</text>
<rect x="642" y="125" width="44" height="140" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.6"/><text x="664" y="285" text-anchor="middle">d2</text><text x="664" y="301" text-anchor="middle" font-size="11" fill="#6b7280">48</text><text x="664" y="317" text-anchor="middle" font-size="11" fill="#6b7280">120×160</text>
<rect x="726" y="70" width="40" height="250" rx="4" fill="#fff7ed" stroke="#eb6834" stroke-width="1.6"/><text x="746" y="340" text-anchor="middle">d1</text><text x="746" y="356" text-anchor="middle" font-size="11" fill="#6b7280">24</text><text x="746" y="372" text-anchor="middle" font-size="11" fill="#6b7280">240×320</text>
<rect x="800" y="70" width="40" height="250" rx="4" fill="#ecfdf5" stroke="#1baf7a" stroke-width="1.6"/><text x="820" y="340" text-anchor="middle">head</text><text x="820" y="356" text-anchor="middle" font-size="11" fill="#6b7280">3 · 1×1</text>
</g>
<line x1="150" y1="195" x2="186" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<line x1="230" y1="195" x2="266" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/><text x="248" y="186" font-size="10" text-anchor="middle" fill="#6b7280">pool</text>
<line x1="314" y1="195" x2="350" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<line x1="406" y1="195" x2="442" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<line x1="510" y1="195" x2="546" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/><text x="528" y="186" font-size="10" text-anchor="middle" fill="#6b7280">up</text>
<line x1="602" y1="195" x2="638" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<line x1="686" y1="195" x2="722" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<line x1="766" y1="195" x2="796" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<path d="M210,70 L210,56 L746,56 L746,66" fill="none" stroke="#6250d6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sa)"/>
<path d="M292,125 L292,108 L664,108 L664,121" fill="none" stroke="#6250d6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sa)"/>
<path d="M380,160 L380,146 L576,146 L576,156" fill="none" stroke="#6250d6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sa)"/>
<text x="478" y="50" font-size="11" fill="#6250d6" text-anchor="middle">skip connections (concatenate)</text>
<rect x="880" y="70" width="295" height="250" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="1027" y="96" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Decoding to instances</text>
<text x="896" y="124" font-size="12" fill="#374151">1  interior = p(interior) &gt; 0.5, open 3×3</text>
<text x="896" y="148" font-size="12" fill="#374151">2  seeds = connected components ≥ 25 px</text>
<text x="896" y="172" font-size="12" fill="#374151">3  watershed on p(seam), mask = not bg</text>
<text x="896" y="196" font-size="12" fill="#374151">4  upsample labels to 480×360</text>
<text x="896" y="232" font-size="11" fill="#6b7280">Each seed grows uphill until it meets the</text>
<text x="896" y="248" font-size="11" fill="#6b7280">crest of a seam. A seam broken for a few</text>
<text x="896" y="264" font-size="11" fill="#6b7280">pixels merges two boxes: the main failure.</text>
<line x1="840" y1="195" x2="876" y2="195" stroke="#374151" stroke-width="1.6" marker-end="url(#sa)"/>
<text x="30" y="410" font-size="13" fill="#374151">Every block: [Conv 3×3 → BatchNorm → ReLU] × 2. Loss: cross-entropy, weights (1, 1, 3) for (background, interior, seam).</text>
<text x="30" y="432" font-size="13" fill="#374151">Seam target: pixels within 2 px of a different box id. 7.2 GMAC per frame; only Conv / BN / ReLU / pool / resize / concat, so it maps directly to TensorRT.</text>
</svg>
